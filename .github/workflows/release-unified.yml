name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Build and verify without creating a tag or release
        type: boolean
        default: false

permissions: {}

# Hold the lock across preflight and publication, including v-prefixed inputs.
concurrency:
  group: crawlkit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the release version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const preflight = require('./.github/scripts/release-preflight.cjs');
            await preflight({ github, context, version: process.env.RELEASE_VERSION, dryRun: process.env.DRY_RUN === 'true' });

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify macOS deployment targets
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            binary="$RUNNER_TEMP/crawlctl-$arch"
            GOOS=darwin GOARCH="$arch" go build -trimpath -o "$binary" ./cmd/crawlctl
            build_version=$(otool -l "$binary" | grep -A3 LC_BUILD_VERSION)
            printf '%s\n' "$build_version"
            minos=$(awk '/minos/ { print $2 }' <<<"$build_version")
            [[ "$minos" == 13.0 ]] || { echo "unexpected macOS minimum: $minos" >&2; exit 1; }
          done
      - name: Preflight notarization access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/notary-preflight.p8"
          trap 'rm -f "$p8"' EXIT
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY_P8" >"$p8"
          xcrun notarytool history --key "$p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --output-format json >"$RUNNER_TEMP/notary-history.json"
          jq -e '.history | type == "array"' "$RUNNER_TEMP/notary-history.json"

  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry_run }}
      repository-type: openclaw
      checksum-filename: checksums.txt
      nfpm: auto
      stable-identifier: org.openclaw.crawlctl
      darwin-universal: disabled
      ci-check-events: '["push","pull_request"]'
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
