name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string

permissions: {}

# Hold the lock across preflight and publication, including v-prefixed inputs.
concurrency:
  group: crawlkit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require an unused release version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const preflight = require('./.github/scripts/release-preflight.cjs');
            await preflight({ github, context, version: process.env.RELEASE_VERSION });

  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ inputs.version }}
      repository-type: openclaw
      checksum-filename: checksums.txt
      nfpm: auto
      stable-identifier: org.openclaw.crawlctl
      darwin-universal: disabled
      ci-check-events: '["push","pull_request"]'
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
